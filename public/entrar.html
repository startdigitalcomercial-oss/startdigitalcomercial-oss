<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar — StartDigital</title>
<link rel="stylesheet" href="/ui.css">
<style>
  .wrap { max-width: 400px; margin: 11vh auto; padding: 0 22px; }
  .marca { display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 17px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 22px; }
  .marca i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: block; }
  .ajuda { text-align: center; font-size: 13px; color: var(--label-3); margin-top: 20px; line-height: 1.6; }
</style>
</head>
<body>

<div class="wrap">
  <div class="marca"><i></i> StartDigital</div>
  <div class="card">
    <h2>Área de integração</h2>
    <p class="sub">Entre com o e-mail e a senha que você criou.</p>

    <div id="aviso"></div>

    <form id="form">
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="email" autocomplete="email" autofocus>
      </div>
      <div class="field" style="margin-top:14px">
        <label>Senha</label>
        <input type="password" id="senha" autocomplete="current-password">
      </div>
      <button class="btn btn-block" style="margin-top:20px" id="btn">Entrar</button>
    </form>
  </div>

  <p class="ajuda">
    Ainda não criou a senha? Use o link que enviamos no e-mail de boas-vindas.<br>
    Perdeu o link ou esqueceu a senha? Fale com a nossa equipe.
  </p>
</div>

<script>
const btn = document.getElementById('btn');

function aviso(msg, tipo) {
  document.getElementById('aviso').innerHTML = msg
    ? '<div class="alert alert-' + (tipo || 'erro') + '">' + msg + '</div>' : '';
}

document.getElementById('form').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  aviso('');
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  if (!email || !senha) return aviso('Preencha o e-mail e a senha.');

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Entrando…';
  try {
    const r = await (await fetch('/api/public?action=entrar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: senha })
    })).json();
    if (!r.ok) throw new Error(r.error || 'Não foi possível entrar.');
    sessionStorage.setItem('start_rh_candidato', r.token);
    location.href = '/portal';
  } catch (e) {
    aviso(e.message);
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
