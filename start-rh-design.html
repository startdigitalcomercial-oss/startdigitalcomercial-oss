<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StartDigital RH — novo design</title>
<style>
:root{--a:#00a15c;--l:#1d1d1f;--l2:#6e6e73;--l3:#8e8e93;--hair:rgba(0,0,0,.09);--canvas:#f5f5f7}
@media (prefers-color-scheme:dark){:root{--a:#1fbf6e;--l:#f5f5f7;--l2:#a1a1a6;--l3:#8e8e93;--hair:rgba(255,255,255,.11);--canvas:#000}}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--l);
 font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
 letter-spacing:-.008em;-webkit-font-smoothing:antialiased}
header{max-width:1140px;margin:0 auto;padding:70px 24px 30px}
header h1{margin:0 0 14px;font-size:44px;line-height:1.05;font-weight:600;letter-spacing:-.028em}
header p{margin:0;color:var(--l2);font-size:19px;line-height:1.5;max-width:66ch;letter-spacing:-.014em}
header .dot{width:9px;height:9px;border-radius:50%;background:var(--a);display:inline-block;margin-right:10px;vertical-align:middle}
main{max-width:1140px;margin:0 auto;padding:10px 24px 70px}
.t{padding:34px 0;border-top:1px solid var(--hair)}
.t h2{margin:0 0 6px;font-size:21px;font-weight:600;letter-spacing:-.019em}
.t p{margin:0 0 20px;color:var(--l2);font-size:15px;line-height:1.5;max-width:76ch}
.t img{width:100%;border-radius:14px;display:block;box-shadow:0 4px 16px rgba(0,0,0,.06)}
footer{text-align:center;color:var(--l3);font-size:13px;padding:0 24px 50px}
</style></head><body>
<header><h1><span class="dot"></span>Novo design</h1>
<p>Refeito no estilo do Apple Design System: hairlines em vez de molduras, cantos grandes, controles em pílula, tipografia com kerning apertado e a cor de marca aparecendo só onde importa. Acompanha o modo claro e escuro do computador.</p></header>
<main>

</main><footer>StartDigital · Sistema de Recrutamento e Seleção</footer></body></html>
