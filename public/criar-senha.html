<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Crie o seu acesso — StartDigital</title>
<link rel="stylesheet" href="/ui.css">
<style>
  .wrap { max-width: 440px; margin: 9vh auto; padding: 0 22px; }
  .marca { display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 17px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 22px; }
  .marca i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: block; }
  .forca { height: 4px; border-radius: 999px; background: var(--fill-2); margin-top: 9px; overflow: hidden; }
  .forca > i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width .25s, background .25s; }
  .forca-txt { font-size: 12.5px; color: var(--label-3); margin-top: 6px; }
  .email-box { background: var(--fill-1); border-radius: var(--r-ctl); padding: 13px 15px; font-size: 14px; margin-bottom: 20px; }
  .email-box span { color: var(--label-3); display: block; font-size: 12.5px; margin-bottom: 2px; }
  .check { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-tint); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 22px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="marca"><i></i> StartDigital</div>

  <div id="carregando" class="loading-page">Carregando…</div>

  <div id="tela-erro" style="display:none">
    <div class="card"><div class="alert alert-aviso" id="msg-erro" style="margin:0"></div></div>
  </div>

  <div id="tela-form" style="display:none">
    <div class="card">
      <h2>Bem-vindo(a), <span id="nome"></span>!</h2>
      <p class="sub">Crie uma senha para entrar na sua área de integração sempre que quiser.</p>

      <div class="email-box">
        <span>Seu e-mail de acesso</span>
        <strong id="email"></strong>
      </div>

      <div id="aviso"></div>

      <form id="form">
        <div class="field">
          <label>Escolha uma senha</label>
          <span class="hint">Pelo menos 6 caracteres. Use algo que você lembre.</span>
          <input type="password" id="senha" autocomplete="new-password" autofocus>
          <div class="forca"><i id="barra"></i></div>
          <div class="forca-txt" id="forca-txt">&nbsp;</div>
        </div>
        <div class="field" style="margin-top:12px">
          <label>Repita a senha</label>
          <input type="password" id="senha2" autocomplete="new-password">
        </div>
        <button class="btn btn-block btn-lg" style="margin-top:20px" id="btn">Criar acesso e entrar</button>
      </form>
    </div>
  </div>

  <div id="tela-ok" style="display:none">
    <div class="card center">
      <div class="check">✓</div>
      <h2 style="font-size:22px">Acesso criado!</h2>
      <p class="muted" style="margin:12px 0 0;line-height:1.6">Levando você para a área de integração…</p>
    </div>
  </div>
</div>

<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const btn = document.getElementById('btn');

function mostrar(id) {
  ['carregando', 'tela-erro', 'tela-form', 'tela-ok'].forEach(function (t) {
    document.getElementById(t).style.display = t === id ? 'block' : 'none';
  });
}
function erroFatal(msg) { document.getElementById('msg-erro').textContent = msg; mostrar('tela-erro'); }
function aviso(msg) {
  document.getElementById('aviso').innerHTML = msg ? '<div class="alert alert-erro">' + msg + '</div>' : '';
}

document.getElementById('senha').addEventListener('input', function () {
  const v = this.value;
  let pontos = 0;
  if (v.length >= 6) pontos++;
  if (v.length >= 10) pontos++;
  if (/[A-Z]/.test(v) && /[a-z]/.test(v)) pontos++;
  if (/[0-9]/.test(v)) pontos++;
  if (/[^A-Za-z0-9]/.test(v)) pontos++;
  const nivel = v.length < 6 ? 0 : Math.min(3, Math.max(1, pontos - 1));
  const cores = ['var(--fill-2)', 'var(--red)', 'var(--orange)', 'var(--accent)'];
  const textos = ['', 'Senha fraca — dá para melhorar', 'Senha razoável', 'Senha forte'];
  const larguras = ['0%', '33%', '66%', '100%'];
  const b = document.getElementById('barra');
  b.style.width = larguras[nivel];
  b.style.background = cores[nivel];
  document.getElementById('forca-txt').innerHTML = textos[nivel] || '&nbsp;';
});

document.getElementById('form').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  aviso('');
  const s1 = document.getElementById('senha').value;
  const s2 = document.getElementById('senha2').value;
  if (s1.length < 6) return aviso('A senha precisa ter pelo menos 6 caracteres.');
  if (s1 !== s2) return aviso('As duas senhas não são iguais. Confira e tente de novo.');

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Criando…';
  try {
    const r = await (await fetch('/api/public?action=conta_criar_senha', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ t: TOKEN, password: s1 })
    })).json();
    if (!r.ok) throw new Error(r.error || 'Não foi possível criar a senha.');
    sessionStorage.setItem('start_rh_candidato', r.token);
    mostrar('tela-ok');
    setTimeout(function () { location.href = '/portal'; }, 1200);
  } catch (e) {
    aviso(e.message);
    btn.disabled = false;
    btn.textContent = 'Criar acesso e entrar';
  }
});

(async function init() {
  if (!TOKEN) return erroFatal('Link inválido. Use o link que enviamos no e-mail de boas-vindas.');
  const r = await (await fetch('/api/public?action=conta_info&t=' + encodeURIComponent(TOKEN))).json();
  if (!r.ok) return erroFatal(r.error || 'Não foi possível abrir esta página.');
  document.getElementById('nome').textContent = r.primeiro_nome;
  document.getElementById('email').textContent = r.email;
  if (r.ja_tem_senha) {
    document.querySelector('#tela-form h2').textContent = 'Redefinir a sua senha';
    document.querySelector('#tela-form p.sub').textContent =
      'Você já tem um acesso criado. Se quiser, escolha uma senha nova aqui.';
    document.getElementById('btn').textContent = 'Salvar nova senha e entrar';
  }
  mostrar('tela-form');
})();
</script>
</body>
</html>
