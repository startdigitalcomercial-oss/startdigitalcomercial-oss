<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trabalhe na StartDigital — Vagas abertas</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest">
<meta name="description" content="Vagas abertas na StartDigital. Somos um time movido por resultado, cultura e gente boa de verdade.">
<meta property="og:title" content="Trabalhe na StartDigital">
<meta property="og:description" content="Se o seu trabalho é extraordinário, seu lugar é aqui.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
  /* ==========================================================
     Cores tiradas da referência
     ========================================================== */
  :root {
    --fundo:      #02053e;
    --fundo-alto: #0c0f46;
    --fio:        #1b1e55;
    --fio-forte:  #252759;
    --tinta:      #ffffff;
    --tinta-2:    #a7a8bc;
    --tinta-3:    #7b7d97;
    --roxo:       #5d25b5;
    --uva:        #8d38a3;
    --rosa:       #e2376d;
    --grad: linear-gradient(96deg, #5d25b5 0%, #8d38a3 52%, #e2376d 100%);
    --grad-suave: linear-gradient(96deg, rgba(93,37,181,.16) 0%, rgba(226,55,109,.16) 100%);
    --topo-h: 74px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    margin: 0; background: var(--fundo); color: var(--tinta);
    font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  .env { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  .gradiente {
    background: var(--grad); -webkit-background-clip: text; background-clip: text;
    color: transparent; font-style: italic;
  }

  /* ---------------------------------------------- topo */
  .topo {
    position: fixed; inset: 0 0 auto 0; z-index: 50; height: var(--topo-h);
    display: flex; align-items: center;
    background: rgba(2,5,62,0); transition: background .3s, border-color .3s, backdrop-filter .3s;
    border-bottom: 1px solid transparent;
  }
  .topo.grudou {
    background: rgba(2,5,62,.86); backdrop-filter: blur(14px);
    border-bottom-color: var(--fio);
  }
  .topo .env { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
  .marca { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; font-size: 17px; }
  .marca img { width: 26px; height: 26px; display: block; }
  .menu { display: flex; gap: 30px; font-size: 15px; font-weight: 500; color: var(--tinta-2); }
  .menu a { position: relative; padding: 4px 0; transition: color .2s; }
  .menu a::after {
    content: ''; position: absolute; left: 0; right: 100%; bottom: 0; height: 2px;
    background: var(--grad); border-radius: 2px; transition: right .28s cubic-bezier(.2,.8,.3,1);
  }
  .menu a:hover { color: #fff; }
  .menu a:hover::after { right: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    border: 0; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 15px;
    padding: 13px 26px; border-radius: 999px; color: #fff; background: var(--grad);
    background-size: 160% 100%; transition: background-position .45s, transform .22s, box-shadow .3s;
    box-shadow: 0 8px 26px -12px rgba(226,55,109,.75);
  }
  .btn:hover { background-position: 100% 0; transform: translateY(-2px); box-shadow: 0 14px 34px -12px rgba(226,55,109,.9); }
  .btn:active { transform: translateY(0); }
  .btn-sm { padding: 10px 22px; font-size: 14px; }
  .btn-lg { padding: 17px 38px; font-size: 16.5px; }
  .btn-vazio {
    background: transparent; border: 1.5px solid var(--fio-forte); box-shadow: none;
    transition: border-color .25s, background .25s, transform .22s;
  }
  .btn-vazio:hover { border-color: #4a3b96; background: rgba(255,255,255,.04); transform: translateY(-2px); }

  /* ---------------------------------------------- selo */
  .selo {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 9px 20px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
    background: rgba(255,255,255,.05); border: 1px solid var(--fio-forte); color: var(--tinta-2);
  }
  .selo i { width: 8px; height: 8px; border-radius: 50%; background: var(--rosa); display: block; }
  .selo i::after {
    content: ''; display: block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--rosa); animation: pulso 2s infinite;
  }
  @keyframes pulso {
    0%   { transform: scale(1);   opacity: .8; }
    70%  { transform: scale(3.2); opacity: 0; }
    100% { transform: scale(3.2); opacity: 0; }
  }
  .selo-linha {
    display: inline-flex; padding: 11px 26px; border-radius: 999px;
    border: 1px solid rgba(226,55,109,.45); background: rgba(226,55,109,.07);
    color: var(--rosa); font-size: 12.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
  }

  /* ---------------------------------------------- hero */
  .hero {
    position: relative; padding: calc(var(--topo-h) + 76px) 0 96px; text-align: center; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; left: 50%; top: -140px; transform: translateX(-50%);
    width: 1100px; height: 900px; pointer-events: none;
    background: radial-gradient(closest-side, rgba(120,48,190,.62), rgba(93,37,181,.22) 52%, transparent 74%);
  }
  .hero::after {
    content: ''; position: absolute; left: 50%; top: 120px; transform: translateX(-50%);
    width: 760px; height: 560px; pointer-events: none;
    background: radial-gradient(closest-side, rgba(226,55,109,.22), transparent 70%);
  }
  .hero .env { position: relative; z-index: 1; }
  h1 {
    margin: 30px auto 0; max-width: 1000px;
    font-size: clamp(40px, 7.4vw, 88px); font-weight: 900; line-height: 1.03; letter-spacing: -.035em;
    text-wrap: balance;
  }
  .hero-sub {
    margin: 30px auto 0; max-width: 34ch; color: var(--tinta-2);
    font-size: clamp(16px, 2vw, 19px); line-height: 1.65;
  }
  .hero-botoes { margin-top: 42px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  /* ---------------------------------------------- seções */
  section { position: relative; padding: 96px 0; }
  .titulo-sec {
    margin: 26px 0 0; font-size: clamp(32px, 5vw, 58px); font-weight: 900;
    line-height: 1.06; letter-spacing: -.032em;
  }
  .centro { text-align: center; }

  #sobre .env { max-width: 900px; }
  .sobre-texto { margin: 34px 0 0; color: var(--tinta-2); font-size: 17.5px; line-height: 1.95; max-width: 62ch; }
  .sobre-texto p { margin: 0 0 22px; }
  .sobre-texto p:last-child { margin-bottom: 0; }

  /* ---------------------------------------------- filtros */
  .filtros { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 40px; }
  .filtro {
    padding: 12px 26px; border-radius: 999px; cursor: pointer; font-family: inherit;
    font-size: 15px; font-weight: 500; color: var(--tinta-2);
    background: var(--fundo-alto); border: 1px solid var(--fio); transition: all .22s;
  }
  .filtro:hover { color: #fff; border-color: var(--fio-forte); transform: translateY(-1px); }
  .filtro.on {
    background: var(--grad); color: #fff; border-color: transparent; font-weight: 700;
    box-shadow: 0 8px 24px -12px rgba(226,55,109,.8);
  }

  /* ---------------------------------------------- cards de vaga */
  .lista { margin-top: 42px; display: flex; flex-direction: column; gap: 20px; }
  .vaga {
    position: relative; display: flex; align-items: center; gap: 28px;
    padding: 30px 34px; border-radius: 22px; cursor: pointer; overflow: hidden;
    background: var(--fundo-alto); border: 1px solid var(--fio);
    transition: transform .28s cubic-bezier(.2,.8,.3,1), border-color .28s, box-shadow .28s;
  }
  .vaga::before {
    content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity .3s;
    background: var(--grad-suave); pointer-events: none;
  }
  .vaga:hover { transform: translateY(-4px); border-color: var(--fio-forte); box-shadow: 0 24px 50px -28px rgba(0,0,0,.9); }
  .vaga:hover::before { opacity: 1; }
  .vaga-corpo { flex: 1; min-width: 0; position: relative; }
  .chips { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 15px; }
  .chip {
    padding: 6px 15px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: rgba(255,255,255,.06); color: var(--tinta-2);
  }
  .chip-area { background: rgba(141,56,163,.3); color: #e3a9f0; }
  .chip-tipo { background: rgba(93,37,181,.42); color: #b9a5f5; }
  .vaga h3 { margin: 0 0 10px; font-size: clamp(21px, 2.6vw, 27px); font-weight: 800; letter-spacing: -.022em; }
  .vaga p { margin: 0 0 16px; color: var(--tinta-2); font-size: 16px; line-height: 1.6; }
  .vaga-pe { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .salario { color: var(--rosa); font-weight: 800; font-size: 18px; }
  .horario { display: flex; align-items: center; gap: 7px; color: var(--tinta-3); font-size: 14.5px; }
  .horario svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; }

  .vaga-seta { flex: none; text-align: center; }
  .seta {
    width: 62px; height: 62px; border-radius: 50%; background: var(--grad); background-size: 160% 100%;
    display: flex; align-items: center; justify-content: center; margin: 0 auto;
    transition: background-position .45s, transform .3s; box-shadow: 0 10px 26px -14px rgba(226,55,109,.9);
  }
  .seta svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2.2; transition: transform .3s; }
  .vaga:hover .seta { background-position: 100% 0; transform: scale(1.06); }
  .vaga:hover .seta svg { transform: translateX(3px); }
  .ver-vaga {
    display: block; margin-top: 10px; font-size: 11.5px; font-weight: 700;
    letter-spacing: .13em; color: var(--tinta-3); text-transform: uppercase;
  }

  .vazio { text-align: center; padding: 60px 20px; color: var(--tinta-3); }

  /* ---------------------------------------------- detalhe da vaga */
  .fundo-escuro {
    position: fixed; inset: 0; z-index: 80; background: rgba(1,2,25,.78);
    backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .fundo-escuro.on { opacity: 1; pointer-events: auto; }
  .painel {
    position: fixed; z-index: 81; top: 0; right: 0; bottom: 0; width: min(620px, 100%);
    background: var(--fundo); border-left: 1px solid var(--fio); overflow-y: auto;
    transform: translateX(100%); transition: transform .38s cubic-bezier(.2,.8,.3,1);
  }
  .painel.on { transform: none; }
  .painel-topo {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 20px 30px; background: rgba(2,5,62,.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--fio);
  }
  .fechar {
    width: 40px; height: 40px; flex: none; border-radius: 50%; cursor: pointer;
    background: var(--fundo-alto); border: 1px solid var(--fio); color: var(--tinta-2);
    display: flex; align-items: center; justify-content: center; font-size: 20px; transition: all .22s;
  }
  .fechar:hover { color: #fff; border-color: var(--fio-forte); transform: rotate(90deg); }
  .painel-corpo { padding: 30px 30px 40px; }
  .painel-corpo h2 { margin: 14px 0 0; font-size: 30px; font-weight: 900; letter-spacing: -.03em; line-height: 1.15; }
  .quadros { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 24px 0 0; }
  .quadro { background: var(--fundo-alto); border: 1px solid var(--fio); border-radius: 14px; padding: 15px 17px; }
  .quadro span { display: block; font-size: 12px; color: var(--tinta-3); margin-bottom: 5px; }
  .quadro strong { font-size: 15.5px; font-weight: 700; }
  .quadro strong.rosa { color: var(--rosa); }
  .bloco { margin-top: 32px; }
  .bloco h4 {
    margin: 0 0 14px; font-size: 12.5px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--rosa);
  }
  .bloco p { margin: 0 0 14px; color: var(--tinta-2); font-size: 16px; line-height: 1.8; white-space: pre-wrap; }
  .bloco ul { margin: 0; padding: 0; list-style: none; }
  .bloco li {
    position: relative; padding-left: 26px; margin-bottom: 12px;
    color: var(--tinta-2); font-size: 16px; line-height: 1.65;
  }
  .bloco li::before {
    content: ''; position: absolute; left: 4px; top: 9px; width: 7px; height: 7px;
    border-radius: 50%; background: var(--grad);
  }
  .painel-pe {
    position: sticky; bottom: 0; margin-top: 34px; padding: 20px 30px 24px;
    margin-left: -30px; margin-right: -30px; margin-bottom: -40px;
    background: rgba(2,5,62,.94); backdrop-filter: blur(12px); border-top: 1px solid var(--fio);
  }
  .painel-pe .btn { width: 100%; }
  .painel-pe small { display: block; text-align: center; color: var(--tinta-3); font-size: 13px; margin-top: 12px; }


  /* ---------------------------------------------- formulário */
  .campo { margin-top: 16px; }
  .campo label { display: block; font-size: 13.5px; font-weight: 600; color: var(--tinta-2); margin-bottom: 7px; }
  .campo input {
    width: 100%; padding: 15px 17px; border-radius: 14px; font-family: inherit; font-size: 16px;
    color: #fff; background: var(--fundo); border: 1.5px solid var(--fio-forte); outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .campo input::placeholder { color: #5c5f85; }
  .campo input:focus { border-color: var(--uva); box-shadow: 0 0 0 4px rgba(141,56,163,.18); }
  .campo .erro { display: block; margin-top: 7px; font-size: 13px; color: #ff6b8a; }

  .trilho { height: 8px; border-radius: 999px; background: var(--fundo-alto); overflow: hidden; }
  .trilho > i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--grad); transition: width .9s cubic-bezier(.2,.8,.3,1); }
  .trilho-txt { margin-top: 10px; font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-3); }

  .final { text-align: center; padding: 8vh 0 4vh; }
  .final h2 { margin: 34px 0 0; font-size: clamp(28px, 4.6vw, 38px); font-weight: 900; letter-spacing: -.03em; line-height: 1.15; }
  .final p { margin: 14px auto 0; max-width: 26ch; color: var(--tinta-2); font-size: 16.5px; line-height: 1.6; }

  .btn-zap {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 21px 24px; border-radius: 18px; font-size: 17.5px; font-weight: 800;
    color: #fff; background: linear-gradient(96deg, #1faa53 0%, #25d366 100%);
    background-size: 160% 100%; border: 0; cursor: pointer; font-family: inherit;
    box-shadow: 0 14px 34px -14px rgba(37,211,102,.85);
    transition: background-position .45s, transform .22s, box-shadow .3s;
  }
  .btn-zap:hover { background-position: 100% 0; transform: translateY(-2px); box-shadow: 0 20px 44px -14px rgba(37,211,102,1); }
  .btn-zap svg { width: 26px; height: 26px; fill: #fff; flex: none; }
  .passos { list-style: none; padding: 0; margin: 22px 0 0; counter-reset: p; }
  .passos li {
    position: relative; padding-left: 38px; margin-bottom: 14px; counter-increment: p;
    color: var(--tinta-2); font-size: 14.5px; line-height: 1.6;
  }
  .passos li::before {
    content: counter(p); position: absolute; left: 0; top: -1px;
    width: 26px; height: 26px; border-radius: 50%; background: var(--grad);
    color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }

  /* ---------------------------------------------- rodapé */
  footer { padding: 60px 0 46px; border-top: 1px solid var(--fio); }
  footer .env { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  footer p { margin: 0; color: var(--tinta-3); font-size: 14px; }

  /* ---------------------------------------------- entrada suave */
  .sobe { opacity: 0; transform: translateY(26px); transition: opacity .7s, transform .7s; }
  .sobe.vis { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .sobe { opacity: 1; transform: none; transition: none; }
    html { scroll-behavior: auto; }
    .selo i::after { animation: none; }
  }

  /* ---------------------------------------------- celular */
  @media (max-width: 760px) {
    .menu { display: none; }
    .topo .env { padding: 0 18px; }
    .env { padding: 0 18px; }
    section { padding: 68px 0; }
    .hero { padding: calc(var(--topo-h) + 46px) 0 68px; }
    .hero-botoes .btn { width: 100%; }
    .vaga { flex-direction: column; align-items: stretch; gap: 20px; padding: 24px; border-radius: 18px; }
    .vaga-seta { display: flex; align-items: center; gap: 12px; justify-content: flex-start; }
    .seta { width: 48px; height: 48px; margin: 0; }
    .ver-vaga { margin-top: 0; }
    .quadros { grid-template-columns: 1fr; }
    .painel-topo, .painel-corpo { padding-left: 20px; padding-right: 20px; }
    .painel-pe { margin-left: -20px; margin-right: -20px; padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>

<!-- ===================== TOPO ===================== -->
<header class="topo" id="topo">
  <div class="env">
    <a href="#inicio" class="marca"><img src="/favicon-32.png" alt=""> StartDigital</a>
    <nav class="menu">
      <a href="#sobre">Sobre</a>
      <a href="#vagas">Vagas</a>
    </nav>
    <a href="#vagas" class="btn btn-sm">Ver vagas</a>
  </div>
</header>

<!-- ===================== HERO ===================== -->
<div class="hero" id="inicio">
  <div class="env">
    <span class="selo"><i></i> <span id="selo-txt">Estamos contratando</span></span>
    <h1 id="h1"></h1>
    <p class="hero-sub" id="hero-sub"></p>
    <div class="hero-botoes">
      <a href="#vagas" class="btn btn-lg">Ver vagas abertas</a>
      <a href="#sobre" class="btn btn-lg btn-vazio">Conhecer a Start</a>
    </div>
  </div>
</div>

<!-- ===================== SOBRE ===================== -->
<section id="sobre">
  <div class="env sobe">
    <span class="selo-linha">Sobre a Start</span>
    <h2 class="titulo-sec" id="sobre-titulo"></h2>
    <div class="sobre-texto" id="sobre-texto"></div>
  </div>
</section>

<!-- ===================== VAGAS ===================== -->
<section id="vagas">
  <div class="env">
    <div class="centro sobe">
      <span class="selo-linha">Oportunidades</span>
      <h2 class="titulo-sec">Vagas <span class="gradiente">abertas</span></h2>
    </div>
    <div class="filtros sobe" id="filtros"></div>
    <div class="lista" id="lista">
      <div class="vazio">Carregando as vagas…</div>
    </div>
  </div>
</section>

<footer>
  <div class="env">
    <a href="#inicio" class="marca"><img src="/favicon-32.png" alt=""> StartDigital</a>
    <p id="rodape"></p>
  </div>
</footer>

<!-- ===================== DETALHE ===================== -->
<div class="fundo-escuro" id="fundo"></div>
<aside class="painel" id="painel" role="dialog" aria-modal="true" aria-label="Detalhes da vaga">
  <div class="painel-topo">
    <span class="selo-linha" id="p-area">Vaga</span>
    <button class="fechar" id="p-fechar" aria-label="Fechar">×</button>
  </div>
  <div class="painel-corpo" id="p-corpo"></div>
</aside>

<script>
var VAGAS = [], AREA = 'todas', DADOS = {};

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function el(id) { return document.getElementById(id); }

/* topo ganha fundo ao rolar */
window.addEventListener('scroll', function () {
  el('topo').classList.toggle('grudou', window.scrollY > 20);
}, { passive: true });

/* seções aparecem subindo */
var olho = new IntersectionObserver(function (itens) {
  itens.forEach(function (i) { if (i.isIntersecting) { i.target.classList.add('vis'); olho.unobserve(i.target); } });
}, { threshold: .12 });
function observar() { document.querySelectorAll('.sobe:not(.vis)').forEach(function (n) { olho.observe(n); }); }

var RELOGIO = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.6V12l3 1.8"/></svg>';
var SETA = '<svg viewBox="0 0 24 24"><path d="M5 12h13M12.5 6l6 6-6 6"/></svg>';

/* ---------------------------------------------- textos do topo */
function montaTextos(d) {
  var L = d.landing || {};
  var n = (d.vagas || []).length;
  el('selo-txt').textContent = (L.badge || 'Estamos contratando') +
    (n ? ' · ' + n + (n === 1 ? ' vaga' : ' vagas') : '');

  el('h1').innerHTML =
    esc(L.headline_1 || 'Se o seu trabalho é') + '<br>' +
    '<span class="gradiente">' + esc(L.headline_destaque || 'extraordinário,') + '</span><br>' +
    esc(L.headline_2 || 'seu lugar é aqui.');
  el('hero-sub').textContent = L.sub || 'Somos um time movido por resultado, cultura e gente boa de verdade!';

  el('sobre-titulo').innerHTML =
    esc(L.sobre_titulo_1 || 'Uma agência que') + ' ' +
    '<span class="gradiente">' + esc(L.sobre_destaque || 'transforma negócios') + '</span> ' +
    esc(L.sobre_titulo_2 || 'de verdade');
  el('sobre-texto').innerHTML = String(L.sobre_texto || '')
    .split(/\n{2,}/).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');

  el('rodape').textContent = '© ' + new Date().getFullYear() + ' ' +
    ((d.empresa && d.empresa.nome) || 'StartDigital') + ' · Todos os direitos reservados';
}

/* ---------------------------------------------- filtros */
function montaFiltros(areas) {
  var todas = ['todas'].concat(areas || []);
  el('filtros').innerHTML = todas.map(function (a) {
    return '<button class="filtro' + (a === AREA ? ' on' : '') + '" data-a="' + esc(a) + '">' +
      (a === 'todas' ? 'Todas' : esc(a)) + '</button>';
  }).join('');
  el('filtros').querySelectorAll('.filtro').forEach(function (b) {
    b.addEventListener('click', function () { AREA = b.dataset.a; montaFiltros(areas); montaLista(); });
  });
}

/* ---------------------------------------------- lista */
function montaLista() {
  var lista = AREA === 'todas' ? VAGAS : VAGAS.filter(function (v) { return v.area === AREA; });
  if (!lista.length) {
    el('lista').innerHTML = '<div class="vazio">Nenhuma vaga aberta nesta área no momento.</div>';
    return;
  }
  el('lista').innerHTML = lista.map(function (v) {
    var local = [v.work_mode_nome, v.location].filter(Boolean).join(' · ');
    return '<article class="vaga sobe" data-slug="' + esc(v.slug) + '" tabindex="0" role="button">' +
      '<div class="vaga-corpo">' +
        '<div class="chips">' +
          (v.area ? '<span class="chip chip-area">' + esc(v.area) + '</span>' : '') +
          (v.employment_type ? '<span class="chip chip-tipo">' + esc(v.employment_type) + '</span>' : '') +
          (local ? '<span class="chip">' + esc(local) + '</span>' : '') +
        '</div>' +
        '<h3>' + esc(v.title) + '</h3>' +
        (v.summary ? '<p>' + esc(v.summary) + '</p>' : '') +
        '<div class="vaga-pe">' +
          (v.salary ? '<span class="salario">' + esc(v.salary) + '</span>' : '') +
          (v.schedule ? '<span class="horario">' + RELOGIO + esc(v.schedule) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="vaga-seta"><div class="seta">' + SETA + '</div><span class="ver-vaga">Ver vaga</span></div>' +
    '</article>';
  }).join('');

  el('lista').querySelectorAll('.vaga').forEach(function (c) {
    c.addEventListener('click', function () { abrir(c.dataset.slug); });
    c.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(c.dataset.slug); }
    });
  });
  observar();
}

/* ---------------------------------------------- detalhe */
function listaHtml(titulo, itens) {
  if (!itens || !itens.length) return '';
  return '<div class="bloco"><h4>' + titulo + '</h4><ul>' +
    itens.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>';
}

function abrir(slug) {
  var v = VAGAS.filter(function (x) { return x.slug === slug; })[0];
  if (!v) return;

  el('p-area').textContent = v.area || 'Vaga aberta';
  el('p-corpo').innerHTML =
    '<h2>' + esc(v.title) + '</h2>' +
    '<div class="quadros">' +
      (v.salary ? '<div class="quadro"><span>Remuneração</span><strong class="rosa">' + esc(v.salary) + '</strong></div>' : '') +
      (v.employment_type ? '<div class="quadro"><span>Contrato</span><strong>' + esc(v.employment_type) + '</strong></div>' : '') +
      (v.work_mode_nome ? '<div class="quadro"><span>Modelo</span><strong>' + esc(v.work_mode_nome) + '</strong></div>' : '') +
      (v.location ? '<div class="quadro"><span>Local</span><strong>' + esc(v.location) + '</strong></div>' : '') +
      (v.schedule ? '<div class="quadro"><span>Horário</span><strong>' + esc(v.schedule) + '</strong></div>' : '') +
      (v.seniority ? '<div class="quadro"><span>Nível</span><strong>' + esc(v.seniority) + '</strong></div>' : '') +
    '</div>' +
    (v.description ? '<div class="bloco"><h4>Sobre a vaga</h4><p>' + esc(v.description) + '</p></div>' : '') +
    listaHtml('O que você vai fazer', v.responsibilities) +
    listaHtml('O que a gente espera', v.requirements) +
    listaHtml('O que oferecemos', v.benefits) +
    '<div class="painel-pe">' +
      '<button class="btn btn-lg" id="p-candidatar">Quero me candidatar</button>' +
      '<small>Leva 1 minuto: você deixa seus dados e conclui pelo WhatsApp.</small>' +
    '</div>';

  el('fundo').classList.add('on');
  el('painel').classList.add('on');
  document.body.style.overflow = 'hidden';
  if (history.replaceState) history.replaceState(null, '', '#' + v.slug);
  el('p-fechar').focus();

  el('p-candidatar').addEventListener('click', function () { telaFormulario(v); });
}

/* ============================================================
   CADASTRO — nome, WhatsApp e e-mail antes de ir para o WhatsApp.
   É este cadastro que autoriza a Aurea a falar com a pessoa.
   ============================================================ */
function mascaraFone(v) {
  const d = String(v).replace(/\D/g, '').slice(0, 11);
  if (d.length <= 2) return d;
  if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
  if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
}

function telaFormulario(v) {
  el('p-area').textContent = v.title;
  el('p-corpo').innerHTML =
    '<h2>Falta pouco</h2>' +
    '<p style="margin:12px 0 0;color:var(--tinta-2);font-size:16px;line-height:1.7">' +
      'Deixe seus dados para a gente saber quem você é. Em seguida você conclui pelo WhatsApp.</p>' +
    '<form id="f-cand" novalidate>' +
      '<div class="campo"><label for="c-nome">Seu nome completo</label>' +
      '<input type="text" id="c-nome" autocomplete="name" placeholder="Maria Aparecida da Silva"></div>' +
      '<div class="campo"><label for="c-fone">WhatsApp com DDD</label>' +
      '<input type="tel" id="c-fone" autocomplete="tel" inputmode="numeric" placeholder="(13) 99600-3897"></div>' +
      '<div class="campo"><label for="c-email">Seu melhor e-mail</label>' +
      '<input type="email" id="c-email" autocomplete="email" placeholder="maria@email.com"></div>' +
      '<div id="c-erro"></div>' +
      '<button class="btn btn-lg" id="c-enviar" style="width:100%;margin-top:24px">Continuar</button>' +
    '</form>';

  const fone = el('c-fone');
  fone.addEventListener('input', function () { this.value = mascaraFone(this.value); });

  el('f-cand').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    const nome = el('c-nome').value.trim();
    const tel = el('c-fone').value.trim();
    const mail = el('c-email').value.trim();
    const erro = function (m) { el('c-erro').innerHTML = '<span class="campo"><span class="erro">' + m + '</span></span>'; };
    el('c-erro').innerHTML = '';

    if (nome.split(/\s+/).length < 2) return erro('Escreva o nome e o sobrenome.');
    if (tel.replace(/\D/g, '').length < 10) return erro('Confira o WhatsApp com DDD.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)) return erro('Confira o e-mail.');

    const b = el('c-enviar');
    b.disabled = true;
    b.textContent = 'Enviando…';
    try {
      const r = await (await fetch('/api/public?action=candidatar', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ vaga: v.slug, name: nome, phone: tel, email: mail })
      })).json();
      if (!r.ok) throw new Error(r.error || 'Não deu para enviar agora.');
      telaWhatsApp(v, r);
    } catch (e) {
      erro(e.message);
      b.disabled = false;
      b.textContent = 'Continuar';
    }
  });
}

var ZAP_ICONE = '<svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5 0-.2 0-.4-.1-.5-.1-.2-.7-1.5-.9-2.1-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1.1 2.8 1.2 3c.2.2 2.1 3.2 5.1 4.4 1.9.8 2.6.9 3.5.7.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.4 1.3 4.9L2 22l5.3-1.4c1.4.8 3 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3c-.9-1.4-1.3-3-1.3-4.6 0-4.6 3.8-8.4 8.4-8.4s8.4 3.8 8.4 8.4-3.7 8.5-8.3 8.5z"/></svg>';

function telaWhatsApp(v, r) {
  el('p-area').textContent = 'Último passo';
  el('p-corpo').innerHTML =
    '<div class="trilho"><i id="barra-fim"></i></div>' +
    '<div class="trilho-txt">70% concluído</div>' +
    '<div class="final">' +
      '<h2>Ainda não concluiu</h2>' +
      (r.link_whatsapp
        ? '<a class="btn-zap" href="' + esc(r.link_whatsapp) + '" target="_blank" rel="noopener" ' +
          'id="c-zap" style="margin-top:32px">' + ZAP_ICONE + 'Conclua o seu processo seletivo</a>'
        : '<p>Não conseguimos abrir a conversa agora. Tente de novo em alguns minutos.</p>') +
    '</div>';
  setTimeout(function () {
    var b = el('barra-fim');
    if (b) b.style.width = '70%';
  }, 120);
}

function fechar() {
  el('fundo').classList.remove('on');
  el('painel').classList.remove('on');
  document.body.style.overflow = '';
  if (history.replaceState) history.replaceState(null, '', location.pathname + '#vagas');
}
el('fundo').addEventListener('click', fechar);
el('p-fechar').addEventListener('click', fechar);
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') fechar(); });

/* ---------------------------------------------- carregar */
(async function () {
  try {
    var r = await (await fetch('/api/public?action=vagas')).json();
    if (!r.ok) throw new Error(r.error || 'falha');
    DADOS = r;
    VAGAS = r.vagas || [];
    montaTextos(r);
    montaFiltros(r.areas);
    montaLista();
    observar();

    // link direto para uma vaga: /vagas#gestor-de-trafego-pleno
    var alvo = (location.hash || '').replace('#', '');
    if (alvo && alvo !== 'vagas' && alvo !== 'sobre' && alvo !== 'inicio') {
      setTimeout(function () { abrir(alvo); }, 320);
    }
  } catch (e) {
    el('lista').innerHTML = '<div class="vazio">Não consegui carregar as vagas agora. Recarregue a página em instantes.</div>';
  }
})();
</script>
